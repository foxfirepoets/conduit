name: Notify SwarmSync of update

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SwarmSync submodule bump
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SWARM_SYNC_PAT }}" \
            https://api.github.com/repos/swarm-sync/swarmsync-ai/dispatches \
            -d "{\"event_type\":\"conduit-updated\",\"client_payload\":{\"conduit_sha\":\"${{ github.sha }}\"}}"
